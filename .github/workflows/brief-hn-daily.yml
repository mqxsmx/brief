name: brief-hn-daily

# caller:每天北京时间约 08:00(UTC 00:00)触发 hackernews-daily。
# 也可在 Actions 页面手动 Run workflow 测试。
on:
  schedule:
    - cron: "0 0 * * *"          # UTC 00:00 每天 = 北京 08:00 每天
  workflow_dispatch:

jobs:
  daily:
    uses: ./.github/workflows/run-brief.yml
    with:
      brief: hackernews-daily
    secrets: inherit
