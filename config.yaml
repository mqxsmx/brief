# Brief 公共配置
# 各 brief 的独立配置在 briefs/<brief-name>/config.yaml,自动继承下方 defaults(brief 同名字段覆盖)。
# 新增 brief = 在 briefs/ 下建 <name>/ 目录 + config.yaml(+ prompt.md / template.html.j2 / processors/)。
#
# 加载逻辑见 core/config.py:load_config —— 读本文件 defaults + 扫描 briefs/*/config.yaml 合并。

defaults:
  renderer:
    type: html
  channels:
    - type: email
      params:
        subject_prefix: "【Brief】"
