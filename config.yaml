# Brief 简报清单
# 每条 brief 自带 schedule / sources / processors / renderer / channels,互不影响。
# 新增简报 = 复制一段改 name + cron + 链路,零改代码。

briefs:
  - name: github-trending-weekly
    title: "GitHub 周报"
    schedule:
      cron: "0 0 * * 1"        # 每周一 UTC 00:00 = 北京 08:00 周一
    sources:
      - type: github_trending
        params:
          since: weekly         # daily | weekly | monthly
          # language: python    # 取消注释可限定语言
    processors:
      - type: hard_filter                              # 关键词/空描述黑名单
      - type: quality_gate                             # 调 GitHub API 卡质量阈值
        params:
          min_forks: 5
          min_watchers: 3
          min_readme_chars: 200
          min_age_days: 3
          max_stale_days: 365
      - type: anti_inflate                             # 反刷榜(标记可疑)
        params:
          min_fork_star_ratio: 0.008
          max_today_ratio: 0.5
          drop_suspect: false                          # 标记降权,不直接删
      - type: dedupe                                   # 去重
      - type: score_rank                               # 综合评分取 Top
        params:
          top_n: 15
    renderer:
      type: html
      params:
        template: templates/email.html.j2
    channels:
      - type: email
        params:
          subject_prefix: "[Brief]"

