name: hackernews-daily
title: "Hacker News 每日精选"
schedule:
  cron: "0 0 * * *"          # 每天 UTC 00:00 = 北京 08:00
sources:
  - type: hackernews
    params:
      hits_per_page: 40        # 过滤前取 40
      min_points: 50           # 最低票数门槛
      window_hours: 24         # 过去 24 小时
processors:
  - type: dedupe                                   # 去重(通用)
  - type: hn_score                                 # HN 评分取 Top 20(本 brief 专属)
    params:
      top_n: 20
  - type: ai_filter                                # LLM 中文精读 + 打类别标签(通用)
    # LLM 配置从环境变量读(LLM_API_BASE/LLM_MODEL/LLM_API_KEY);提示词从 prompt_file 加载
    params:
      prompt_file: briefs/hackernews-daily/prompt.md
renderer:
  type: html
  params:
    template: briefs/hackernews-daily/template.html.j2
# channels 继承 config.yaml defaults(【Brief】email)
